name: tyr_creator
description: تطبيق تيار - صانع المحتوى للقوالب الإخبارية وإطارات الفيديو
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  screenshot: ^3.0.0
  gal: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  video_player: ^2.9.2
  ffmpeg_kit_flutter_new: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/frames/
